name: CI

# Только main и PR в main; никаких секретов и никакого деплоя.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Отмена устаревших прогонов на той же ветке или PR экономит раннеры.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимум прав: workflow только читает репозиторий.
permissions:
  contents: read

jobs:
  gate:
    name: Gate (typecheck, lint, Vitest, Playwright, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Отдельная тестовая база: имя заканчивается на `_test`, как требуют
    # global-setup.ts для Vitest и Playwright. Mimic compose.yaml, но без тома.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: digital_deanery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d digital_deanery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Все тесты работают только с тестовой БД; dev-базы в CI нет.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/digital_deanery_test?schema=public"
      DATABASE_URL_TEST: "postgresql://postgres:postgres@localhost:5432/digital_deanery_test?schema=public"
      # Нейтральные значения только для CI: это не секреты и не прод-данные.
      BETTER_AUTH_SECRET: "ci-only-not-a-real-secret-0123456789abcdef"
      BETTER_AUTH_URL: "http://localhost:3100"
      NEXT_PUBLIC_APP_URL: "http://localhost:3100"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (npm cache)
        uses: actions/setup-node@v4
        with:
          # package.json требует Node >= 22.13; метка 22 даёт последний 22.x.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Документированная команда из README. Системные библиотеки Chromium
      # предустановлены на ubuntu-latest.
      - name: Install Playwright Chromium
        run: npm run test:e2e:install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check formatting
        run: npm run format:check

      # GitHub Actions сам выставляет CI=true: Playwright включает forbidOnly и ретраи.
      - name: Full gate
        run: npm run gate
